title: Resonix
resonix_version: "0.17.2"
description: A fast, lightweight YouTube Music client for Linux, macOS, and Windows.
lang: en-US
timezone: UTC
url: https://itsarcn.github.io
baseurl: "/Resonix"
logo: /assets/images/logo.svg
image: /screenshot.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
      topics:
        - YouTube Music client
        - Rust
        - egui
        - fastframe
        - yt-dlp
        - Linux music player
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  versions:
    next: true
  seo:
    page_type: TechArticle
    image:
      path: /screenshot.png
      alt: Resonix showing the library, queue, and music player
    publisher:
      type: Person
      name: ARCn
      url: https://github.com/ItsARCn
      same_as:
        - https://github.com/ItsARCn/Resonix
  llms:
    title: Resonix
    description: >-
      Documentation for Resonix, a native YouTube Music client for Linux, macOS,
      and Windows built on Spotifast's egui UI and Sunder's YouTube backend.
    full: true
    details: >-
      Covers building from source, playback, Discord Rich Presence, settings,
      themes, Winamp/WMP skins, and MilkDrop visuals. Source is on
      [GitHub](https://github.com/ItsARCn/Resonix).
  branding:
    site_title: Resonix
    logo:
      default: /assets/images/logo.svg
      alt: Resonix
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Built on <a href="https://github.com/crmne/spotifast" target="_blank" rel="noreferrer">Spotifast</a> and <a href="https://github.com/FrogSnot/Sunder" target="_blank" rel="noreferrer">Sunder</a>.
    copyright: >-
      <span class="footer-built-with">Resonix is an independent open-source project, not affiliated with YouTube, Google, or Spotify AB.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/ItsARCn/Resonix/edit/main/docs/:path"
    text: Edit this page on GitHub
