name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the native packages' declared glibc 2.39 baseline.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # A native arm64 runner, so the GUI's system libraries need no
          # cross-compilation sysroot.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vcpkg-triplet: x64-windows-static
            msvc-arch: x64
            pe-machine: 8664 machine \(x64\)
          # A native arm64 runner: built, checked, and started on arm64.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            vcpkg-triplet: arm64-windows-static
            msvc-arch: arm64
            pe-machine: AA64 machine \(ARM64\)
    steps:
      - uses: actions/checkout@v7
      # The release's artifacts carry the tag's name (packages are named and versioned
      # from GITHUB_REF_NAME), while the binary reports Cargo.toml's version
      # (env!("CARGO_PKG_VERSION")). Refuse a mismatch before building.
      - name: The tag and the crate version must agree
        shell: bash
        run: |
          v=$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} names $tag, but Cargo.toml says $v; bump the crate's version or retag"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev
      # libprojectM reads OpenGL through GLEW on Windows; projectm-sys builds
      # against vcpkg's static-CRT triplet, matching .cargo/config.toml.
      - name: GLEW for libprojectM
        if: runner.os == 'Windows'
        run: vcpkg install glew:${{ matrix.vcpkg-triplet }}
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      # No compiler cache: published binaries never build from restored caches.
      - run: cargo build --release --target ${{ matrix.target }}

      # The zip and installer must run on a clean Windows machine without a
      # separately installed Visual C++ redistributable.
      - name: Verify standalone Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target\${{ matrix.target }}\release\resonix.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Resonix imports an MSVC runtime:`n$runtime" }
          $headers = & dumpbin /headers $binary | Out-String
          if ($headers -notmatch '${{ matrix.pe-machine }}') { throw "$binary is not built for ${{ matrix.target }}:`n$headers" }
          $version = (& $binary --version | Out-String).Trim()
          if ($version -notmatch '^resonix \d+\.\d+\.\d+') { throw "Unexpected --version output: $version" }
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne "resonix $tag") { throw "The binary reports $version, but the tag names $tag" }

      - name: Hand the Windows binary on
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/resonix.exe
          if-no-files-found: error

      - name: Package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="resonix-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/resonix" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp packaging/resonix-portable.txt "dist/$name/"
          # Desktop integration for package builds and hand-installs.
          cp --parents packaging/applications/resonix.desktop packaging/icons/resonix.svg "dist/$name/"
          cp --parents contrib/omarchy/resonix.json.tpl contrib/omarchy/resonix-theme "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"

      # The AppImage, from the archive just built and before the release is
      # published: checksums.txt lists it with its .zsync file and the
      # signature covers both, so the app's updater replaces an AppImage
      # only with a signed one (fastframe-update). Stable releases only.
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Linux' && !contains(github.ref_name, '-')
        with:
          ruby-version: '4.0'
      - name: AppImage
        if: runner.os == 'Linux' && !contains(github.ref_name, '-')
        run: |
          sudo apt-get install -y --no-install-recommends libarchive-tools squashfs-tools zsync
          gem install native-packages --version 0.11.0 --no-document
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) id=appimage-amd64 ;;
            aarch64-unknown-linux-gnu) id=appimage-arm64 ;;
            *) echo "No AppImage target for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          native-packages build --version "${GITHUB_REF_NAME#v}" --target "$id" --defer-recipes \
            --output "$RUNNER_TEMP/appimage"
          cp "$RUNNER_TEMP/appimage/packages/$id/appimage/"*.AppImage \
            "$RUNNER_TEMP/appimage/packages/$id/appimage/"*.AppImage.zsync dist/

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error

  windows:
    name: windows (${{ matrix.target }})
    needs: build
    # WiX builds arm64 packages on x64 as well as x64 packages.
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            package-target: windows-amd64
            msvc-arch: x64
          - target: aarch64-pc-windows-msvc
            package-target: windows-arm64
            msvc-arch: amd64_arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install native-packages
        run: gem install native-packages --version 0.11.0 --no-document

      - name: Package
        shell: bash
        run: |
          name="resonix-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/resonix.exe" "dist/$name/"
          cp README.md LICENSE packaging/resonix-portable.txt "dist/$name/"
          cd dist
          7z a "$name.zip" "$name"

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      - name: Windows Installer package
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $payload = "dist\msi-input-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $payload | Out-Null
          $files = "target\${{ matrix.target }}\release\resonix.exe", "README.md", "LICENSE", "packaging\windows\resonix-installer.txt"
          Copy-Item $files $payload
          $packages = "$env:RUNNER_TEMP\windows-packages"
          native-packages build --version $version --target ${{ matrix.package-target }} --defer-recipes --output $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$packages\packages\${{ matrix.package-target }}\msi\*.msi" dist\

      # Replaces the binary the build job handed over with the packages.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          overwrite: true
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  macos:
    name: macOS universal app
    runs-on: macos-latest
    env:
      # Optional Apple credentials enable native-packages signing/notarization;
      # without them, bundle.sh ad-hoc signs the universal bundle.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/resonix \
            target/x86_64-apple-darwin/release/resonix \
            -output universal/resonix

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install native packaging
        run: gem install native-packages --version 0.11.0 --no-document

      - name: App bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/macos-input
          bash packaging/macos/bundle.sh universal/resonix dist/macos-input/Resonix.app "$version"
          cp README.md LICENSE dist/macos-input/

      - name: Package macOS app
        run: |
          native-packages build \
            --version "${GITHUB_REF_NAME#v}" --target macos-universal --defer-recipes \
            --output "$RUNNER_TEMP/macos-packages"
          cp "$RUNNER_TEMP/macos-packages/packages/macos-universal/dmg/"*.dmg dist/

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  # The Linux build packaged as a Flatpak bundle without compiling twice.
  flatpak:
    name: Flatpak bundle
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - name: Unpack the Linux build
        run: |
          tar xzf dist/resonix-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz -C packaging/flatpak "resonix-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mv packaging/flatpak/resonix-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu packaging/flatpak/built
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.itsarcn.Resonix.bundle.yml
          bundle: resonix-${{ github.ref_name }}-x86_64.flatpak
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: "*.flatpak"
          if-no-files-found: error

  publish:
    name: GitHub release
    # The bundle is welcome but not required: a Flatpak failure must not
    # hold the release.
    needs: [build, windows, macos, flatpak]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # Include the source archive beside the binaries.
      - name: Source archive
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" \
            --output "dist/resonix-${GITHUB_REF_NAME}-source.tar.gz"
      - name: Public filenames, updater compatibility and checksums
        run: python3 packaging/release-names.py dist "$GITHUB_REF_NAME"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      # Sign checksums.txt -> checksums.txt.sig and verify against assets/update-public-key.hex
      # so Resonix's built-in updater verifies and installs releases automatically.
      - name: Sign checksums
        env:
          RESONIX_UPDATE_SIGNING_KEY: ${{ secrets.RESONIX_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "${RESONIX_UPDATE_SIGNING_KEY:-}" ]; then
            echo "::error::Missing RESONIX_UPDATE_SIGNING_KEY repository secret matching assets/update-public-key.hex"
            exit 1
          fi
          gem install native-packages --version 0.11.0 --no-document
          native-packages sign-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex \
            --key-env RESONIX_UPDATE_SIGNING_KEY
          native-packages verify-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Resonix ${{ github.ref_name }}
          body_path: packaging/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  packaging:
    # Build .deb, .rpm, and packaging-checksums.txt and attach them to the release.
    if: ${{ !cancelled() && needs.publish.result == 'success' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    needs: publish
    uses: ./.github/workflows/packaging.yml
    with:
      version: ${{ github.ref_name }}
      publish: true
    secrets: inherit
