name: Docs

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - docs/**
      - .github/workflows/docs.yml
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: docs
      - uses: actions/configure-pages@v5
      - name: Build documentation site
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll-vitepress build --destination "${{ runner.temp }}/_site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
