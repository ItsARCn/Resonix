name: Bug report
description: Something does not work, or the app crashed or vanished.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please include the log from Resonix's last run:

        - Linux: `~/.local/state/resonix/resonix.log`
        - macOS: `~/Library/Application\ Support/me.paolino.resonix/resonix.log`
        - Windows: `%LOCALAPPDATA%\paolino\resonix\data\resonix.log`

        If the app crashed or vanished, include `panic.log` from the same folder.
  - type: input
    id: version
    attributes:
      label: Resonix version and how you installed it
      placeholder: "0.17.2 from .deb / .rpm / AppImage / Flatpak / DMG / Windows installer"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os_details
    attributes:
      label: System details
      description: Distribution and desktop on Linux, or the OS version.
      placeholder: "Arch, Hyprland, PipeWire / macOS 15.6 / Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you do, and what happened instead?
      placeholder: "1. Opened Home. 2. Pressed play on a track. 3. Playback failed with an error."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: resonix.log
      description: Reproduce the problem, quit the app, then paste the whole file here (and panic.log, if there is one). Paths are above.
